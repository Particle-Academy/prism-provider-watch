name: PHPStan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  phpv: 8.3

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.phpv }}
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github
